<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8796"/>
    </marker>
    <style>
      .box{fill:#18202b;stroke:#2f3a48;stroke-width:1.2}
      .t{fill:#e6edf3;font-size:15px;font-weight:600}
      .s{fill:#9aa6b2;font-size:12px}
      .ln{stroke:#7d8796;stroke-width:1.4;fill:none}
      .wave{stroke:#22b8a6;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect fill="#0d1117" width="1200" height="520" rx="14"/>
  <text x="40" y="44" fill="#e6edf3" font-size="22" font-weight="700">Two-phase shielding-effectiveness measurement</text>
  <text x="40" y="68" class="s">Same transmit chain and receive position for both phases; only the enclosure state changes.</text>

  <!-- Control PC -->
  <rect class="box" x="40" y="110" width="220" height="120" rx="10"/>
  <text x="58" y="138" class="t">Control computer</text>
  <text x="58" y="158" class="s">SKIPPY GUI + TestRunner</text>
  <text x="58" y="176" class="s">SCPI over TCP/IP (LAN)</text>
  <text x="58" y="194" class="s">analysis · DB · report</text>

  <!-- TX -->
  <rect class="box" x="40" y="290" width="220" height="110" rx="10"/>
  <text x="58" y="318" class="t">TX: VSG60A generator</text>
  <text x="58" y="338" class="s">CW tone stepped through</text>
  <text x="58" y="356" class="s">the test plan (≤5.9 GHz)</text>
  <text x="58" y="374" class="s">fixed output power (dBm)</text>
  <path class="ln" d="M150 230 L150 290" marker-end="url(#a)"/>
  <!-- tx antenna -->
  <path class="ln" d="M260 345 L330 345"/>
  <path d="M330 345 L330 300 M318 312 L330 300 L342 312" stroke="#e6edf3" stroke-width="2" fill="none"/>
  <text x="300" y="372" class="s">TX antenna</text>

  <!-- waves -->
  <path class="wave" d="M350 300 q12 -14 24 0 t24 0 t24 0 t24 0 t24 0"/>
  <path class="wave" d="M350 330 q12 -14 24 0 t24 0 t24 0 t24 0 t24 0" opacity="0.6"/>

  <!-- Phase A -->
  <text x="520" y="112" fill="#22b8a6" font-size="13" font-weight="700" letter-spacing="1.5">PHASE 1 · REFERENCE</text>
  <rect x="510" y="124" width="300" height="150" rx="10" fill="none" stroke="#2f3a48" stroke-dasharray="6 5"/>
  <text x="526" y="148" class="s">enclosure open / absent</text>
  <rect class="box" x="590" y="170" width="200" height="80" rx="8"/>
  <text x="606" y="196" class="t">RX: BB60C analyzer</text>
  <text x="606" y="216" class="s">10 kHz span at each point</text>
  <text x="606" y="234" class="s">→ P_ref (dBm) ± σ</text>
  <path d="M560 240 L560 200 M548 212 L560 200 L572 212" stroke="#e6edf3" stroke-width="2" fill="none"/>

  <!-- Phase B -->
  <text x="520" y="318" fill="#ffb02e" font-size="13" font-weight="700" letter-spacing="1.5">PHASE 2 · SHIELDED</text>
  <rect x="510" y="330" width="300" height="150" rx="14" fill="#141a22" stroke="#ffb02e" stroke-width="3"/>
  <text x="526" y="354" class="s">DUT enclosure closed around RX</text>
  <rect class="box" x="590" y="376" width="200" height="80" rx="8"/>
  <text x="606" y="402" class="t">RX: BB60C analyzer</text>
  <text x="606" y="422" class="s">same settings and position</text>
  <text x="606" y="440" class="s">→ P_shielded (dBm) ± σ</text>
  <path d="M560 446 L560 406 M548 418 L560 406 L572 418" stroke="#e6edf3" stroke-width="2" fill="none"/>

  <path class="ln" d="M470 300 L505 200" marker-end="url(#a)"/>
  <path class="ln" d="M470 330 L505 400" marker-end="url(#a)"/>

  <!-- Result -->
  <rect class="box" x="870" y="190" width="290" height="190" rx="10" style="stroke:#22b8a6"/>
  <text x="890" y="220" class="t">Per frequency point</text>
  <text x="890" y="254" fill="#e6edf3" font-size="18" font-family="Georgia, serif">SE = P_ref − P_shielded</text>
  <text x="890" y="288" fill="#e6edf3" font-size="15" font-family="Georgia, serif">σ_SE = √(σ_ref² + σ_shielded²)</text>
  <text x="890" y="318" class="s">σ = √(σ_stat² + σ_SNR²), with σ_SNR from</text>
  <text x="890" y="336" class="s">0.5 / 2.0 / 5.0 dB tiers vs. DANL model</text>
  <text x="890" y="362" class="s">→ band stats, integrated SE, verdict</text>
  <path class="ln" d="M810 200 L866 250" marker-end="url(#a)"/>
  <path class="ln" d="M810 405 L866 330" marker-end="url(#a)"/>
  <path class="ln" d="M260 170 L690 170" stroke-dasharray="4 4"/>
  <text x="380" y="162" class="s">LAN / SCPI</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
